name: Build & Publish KMP (Android + iOS)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "**.html"
  workflow_dispatch:

env:
  APP_NAME: "WaveCal"
  BUNDLE_ID: "cz.mares.wavecal"
  APP_VERSION: "1.1"
  PUBLISH_TO_STORES: "true"
  BUILD_IOS: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    name: Android Release (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect Package Name and Prepare Build Number
        run: |
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          echo "PROJECT_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          if [ -f "composeApp/build.gradle.kts" ]; then
            DETECTED_PKG=$(sed -n 's/.*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_PKG" ]; then
              echo "Automaticky rozpoznano applicationId: $DETECTED_PKG"
              echo "BUNDLE_ID=${DETECTED_PKG}" >> $GITHUB_ENV
            fi
          fi
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/gw_init
            echo 'rootProject.name = "init"' > /tmp/gw_init/settings.gradle.kts
            cd /tmp/gw_init
            gradle wrapper --gradle-version 8.7 --no-daemon
            cd - > /dev/null
            cp -f /tmp/gw_init/gradlew .
            cp -rf /tmp/gw_init/gradle .
          fi
          chmod +x gradlew

      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.b64" -o "iosApp/signing/android_keystore.b64" && \
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.props" -o "iosApp/signing/android_keystore.props"; then
              echo "✅ Nacten vlastni Android keystore pro projekt ${APP_NAME} z trezoru ios-keys."
            else
              for f in android_keystore.b64 android_keystore.props; do
                curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
              done
              echo "✅ Nacten vychozi Android keystore z trezoru ios-keys."
            fi
            curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/gplaykey.json.b64" -o "iosApp/signing/gplaykey.json.b64" || rm -f "iosApp/signing/gplaykey.json.b64"
            for hf in huawei_key.json.b64 huaweikey.json.b64 agconnect_key.json.b64; do
              if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${hf}" -o "iosApp/signing/huawei_key.json.b64"; then
                break
              fi
            done
          fi

      - name: Prepare Android Signing Keystore
        run: |
          if [ -s "iosApp/signing/android_keystore.b64" ] && [ -s "iosApp/signing/android_keystore.props" ]; then
            base64 --decode < iosApp/signing/android_keystore.b64 > /tmp/android_keystore.jks
            echo "CM_KEYSTORE_PATH=/tmp/android_keystore.jks" >> $GITHUB_ENV
            while IFS='=' read -r key val; do
              key=$(echo "$key" | tr -d '\r\n ')
              val=$(echo "$val" | tr -d '\r\n')
              if [ -n "$key" ]; then
                export "${key}=${val}"
                echo "${key}=${val}" >> $GITHUB_ENV
              fi
            done < iosApp/signing/android_keystore.props
            DETECTED_ALIAS=$(keytool -J-Duser.language=en -list -v -keystore /tmp/android_keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "✅ Automaticky rozpoznan alias v Android keystore: $DETECTED_ALIAS"
              echo "CM_KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV
            fi
            echo "✅ Android podpisovy klic je pripraven."
          else
            echo "⚠️ UPOZORNENI: Android keystore nebyl nalezen, build pobezi bez produkcniho podpisu."
          fi

      - name: Build Android Release AAB and APK
        run: |
          if [ -f "composeApp/build.gradle.kts" ]; then
            sed -i "s/versionName = \"[0-9.]*\\.\$ciBuildNumber\"/versionName = \"${APP_VERSION}.\$ciBuildNumber\"/g" composeApp/build.gradle.kts || true
            sed -i "s/versionName = \"[0-9.]*\\.\\\${ciBuildNumber}\"/versionName = \"${APP_VERSION}.\\\${ciBuildNumber}\"/g" composeApp/build.gradle.kts || true
          fi
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease
          BUILD_NUM="${PROJECT_BUILD_NUMBER}"
          VERSION_NAME="${APP_VERSION}.${BUILD_NUM}"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk "composeApp/build/outputs/apk/release/${APP_NAME}-${VERSION_NAME}.apk"
          mv composeApp/build/outputs/bundle/release/composeApp-release.aab "composeApp/build/outputs/bundle/release/${APP_NAME}-${VERSION_NAME}.aab"
          echo "✅ VYSLEDEK ANDROID BUILDU: Balicky ${APP_NAME}-${VERSION_NAME}.apk a .aab byly uspesne sestaveny!"

      - name: Upload Android Artifacts (.apk & .aab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Android-APK-AAB
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab

      - name: Publish Android AAB to Google Play (Internal Testing)
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "ℹ️ VYSLEDEK GOOGLE PLAY: Publikace do obchodu je vypnuta (rezim bez publikace). Preskakuji Google Play."
          elif [ -s "iosApp/signing/gplaykey.json.b64" ]; then
            echo "⏳ Pripojuji se ke Google Play Console a nahravam .aab (timeout nastaven na 300 s)..."
            base64 --decode < iosApp/signing/gplaykey.json.b64 > /tmp/gplay_key.json
            pip3 install --quiet --break-system-packages google-api-python-client google-auth-httplib2 google-auth-oauthlib || \
            pip3 install --quiet google-api-python-client google-auth-httplib2 google-auth-oauthlib

            python3 - << 'EOF'
          import os, time, socket
          import httplib2
          import google_auth_httplib2
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          socket.setdefaulttimeout(300)

          package_name = os.environ.get("BUNDLE_ID")
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101")
          app_name = os.environ.get("APP_NAME")
          app_version = os.environ.get("APP_VERSION", "1.0")
          aab_path = f"composeApp/build/outputs/bundle/release/{app_name}-{app_version}.{build_num}.aab"

          def upload_to_gplay():
              creds = service_account.Credentials.from_service_account_file(
                  "/tmp/gplay_key.json",
                  scopes=["https://www.googleapis.com/auth/androidpublisher"]
              )
              http = httplib2.Http(timeout=300)
              authed_http = google_auth_httplib2.AuthorizedHttp(creds, http=http)
              service = build("androidpublisher", "v3", http=authed_http, cache_discovery=False)

              edit_request = service.edits().insert(body={}, packageName=package_name)
              result = edit_request.execute(num_retries=5)
              edit_id = result["id"]

              media = MediaFileUpload(aab_path, mimetype="application/octet-stream", resumable=True)
              bundle_response = service.edits().bundles().upload(
                  editId=edit_id,
                  packageName=package_name,
                  media_body=media
              ).execute(num_retries=5)
              version_code = bundle_response["versionCode"]
              print(f"📦 Soubor {os.path.basename(aab_path)} nahran do Google Play (kod verze: {version_code}).")

              def commit_edit(eid, is_draft=False):
                  try:
                      service.edits().commit(editId=eid, packageName=package_name).execute(num_retries=5)
                      if is_draft:
                          print(f"✅ VYSLEDEK GOOGLE PLAY: Balicek .aab (verze {app_version}.{build_num}) byl ulozen jako koncept (Draft) v Google Play!")
                      else:
                          print(f"✅ VYSLEDEK GOOGLE PLAY: Balicek .aab (verze {app_version}.{build_num}) byl uspesne publikovan do Google Play!")
                  except Exception as cerr:
                      err_str = str(cerr)
                      if "Only releases with status draft" in err_str:
                          raise cerr
                      service.edits().commit(
                          editId=eid,
                          packageName=package_name,
                          changesNotSentForReview=True
                      ).execute(num_retries=5)
                      print(f"✅ VYSLEDEK GOOGLE PLAY: Balicek .aab (verze {app_version}.{build_num}) byl ulozen do Google Play (changesNotSentForReview=True)!")

              try:
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="internal",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "completed"}]}
                  ).execute(num_retries=5)
                  commit_edit(edit_id, is_draft=False)
              except Exception:
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="internal",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "draft"}]}
                  ).execute(num_retries=5)
                  commit_edit(edit_id, is_draft=True)

          max_attempts = 3
          for attempt in range(1, max_attempts + 1):
              try:
                  upload_to_gplay()
                  break
              except HttpError as e:
                  err_txt = str(e)
                  if e.resp.status == 404:
                      print(f"⚠️ VYSLEDEK GOOGLE PLAY: Aplikace s balickem '{package_name}' zatim v Google Play Console neexistuje (404). Prvni .aab soubor je nutne nahrat do konzole rucne.")
                      break
                  elif "already been used" in err_txt or "version code" in err_txt.lower():
                      print(f"✅ VYSLEDEK GOOGLE PLAY: Verze s kodem {build_num} uz je v Google Play Console nahrana z predchoziho pokusu.")
                      break
                  else:
                      print(f"⚠️ UPOZORNENI (pokus {attempt}/{max_attempts}): Google Play API vratilo stav {e.resp.status}: {err_txt}")
                      if attempt < max_attempts:
                          time.sleep(10)
              except Exception as e:
                  print(f"⏳ UPOZORNENI (pokus {attempt}/{max_attempts}): Prodleva odpovedi Google Play ({e}).")
                  if attempt < max_attempts:
                      print("Cekam 15 sekund a overuji stav zapisu v Google Play...")
                      time.sleep(15)
                  else:
                      print(f"⚠️ VYSLEDEK GOOGLE PLAY: Nepodarilo se dokoncit zapis do Google Play ani po {max_attempts} pokusech: {e}")
          EOF
          else
            echo "⚠️ VYSLEDEK GOOGLE PLAY: Klic gplaykey.json nebyl v trezoru nalezen, preskakuji Google Play."
          fi

      - name: Publish Android APK to Huawei AppGallery
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "ℹ️ VYSLEDEK HUAWEI APPGALLERY: Publikace do obchodu je vypnuta (rezim bez publikace). Preskakuji Huawei AppGallery."
          elif [ -s "iosApp/signing/huawei_key.json.b64" ]; then
            echo "⏳ Pripojuji se k Huawei AppGallery Connect pres Service Account JWT..."
            base64 --decode < iosApp/signing/huawei_key.json.b64 > /tmp/huawei_key.json
            pip3 install --quiet --break-system-packages pyjwt cryptography requests || \
            pip3 install --quiet pyjwt cryptography requests

            python3 - << 'EOF'
          import os, sys, json, time, jwt, requests

          package_name = os.environ.get("BUNDLE_ID", "").strip()
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101").strip()
          app_name = os.environ.get("APP_NAME", "").strip()
          app_version = os.environ.get("APP_VERSION", "1.0").strip()
          apk_path = f"composeApp/build/outputs/apk/release/{app_name}-{app_version}.{build_num}.apk"

          KNOWN_APP_IDS = {
              "cz.taximares.radiopm": "119618129",
              "cz.mares.radiopm": "119618129"
          }

          if not os.path.exists(apk_path):
              print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Soubor {apk_path} nebyl nalezen, preskakuji upload.")
              sys.exit(0)

          try:
              with open("/tmp/huawei_key.json", "r", encoding="utf-8") as f:
                  hk = json.load(f)
              key_id = str(hk.get("key_id", "")).strip()
              priv_key = str(hk.get("private_key", "")).strip()
              sub_account = str(hk.get("sub_account", "")).strip()
              token_uri = str(hk.get("token_uri", "https://connect-api.cloud.huawei.com/api/oauth2/v1/token")).strip()
              base_agc = "https://connect-api.cloud.huawei.com/api"

              now = int(time.time())
              candidates = []
              if sub_account and priv_key:
                  for alg in ["PS256", "RS256"]:
                      for aud_val in [
                          token_uri,
                          "https://oauth-login.cloud.huawei.com/oauth2/v3/token",
                          "https://connect-api.cloud.huawei.com/api/oauth2/v1/token",
                          "https://connect-api.cloud.huawei.com"
                      ]:
                          try:
                              pl = {"iss": sub_account, "aud": aud_val, "iat": now - 30, "exp": now + 3000}
                              tok = jwt.encode(pl, priv_key, algorithm=alg, headers={"kid": key_id, "typ": "JWT", "alg": alg})
                              if isinstance(tok, bytes):
                                  tok = tok.decode("utf-8")
                              candidates.append((f"JWT-{alg}", {
                                  "Authorization": f"Bearer {tok}",
                                  "client_id": sub_account,
                                  "Content-Type": "application/json"
                              }))
                          except Exception:
                              pass

              if "client_secret" in hk or "key" in hk:
                  c_sec = hk.get("client_secret") or hk.get("key")
                  c_id = hk.get("client_id") or sub_account
                  tr = requests.post(f"{base_agc}/oauth2/v1/token", json={"grant_type": "client_credentials", "client_id": c_id, "client_secret": c_sec}, timeout=30)
                  if tr.ok and tr.json().get("access_token"):
                      at = tr.json()["access_token"]
                      candidates.insert(0, ("OAuth", {
                          "Authorization": f"Bearer {at}",
                          "client_id": str(c_id),
                          "Content-Type": "application/json"
                      }))

              working_headers = None
              app_res = None
              known_id = KNOWN_APP_IDS.get(package_name, "")

              for label, hdrs in candidates:
                  test_r = requests.get(f"{base_agc}/publish/v2/appid-list", params={"packageName": package_name}, headers=hdrs, timeout=30)
                  if test_r.ok:
                      working_headers = hdrs
                      app_res = test_r
                      print(f"🔐 Prihlaseni k Huawei AppGallery Connect uspesne ({label}).")
                      break
                  elif known_id:
                      test_r2 = requests.get(f"{base_agc}/publish/v2/app-info", params={"appId": known_id}, headers=hdrs, timeout=30)
                      if test_r2.ok:
                          working_headers = hdrs
                          app_res = test_r2
                          print(f"🔐 Prihlaseni k Huawei AppGallery Connect uspesne pres App ID {known_id} ({label}).")
                          break

              if not working_headers:
                  print("⚠️ VYSLEDEK HUAWEI APPGALLERY: Autorizace byla odmitnuta. Zkontroluj opravneni klice v AppGallery Connect.")
                  sys.exit(0)

              huawei_app_id = ""
              if app_res and app_res.ok:
                  app_ids = app_res.json().get("appids", [])
                  if app_ids:
                      huawei_app_id = str(app_ids[0].get("value", ""))

              if not huawei_app_id and known_id:
                  huawei_app_id = known_id

              if not huawei_app_id:
                  print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Aplikace s balickem '{package_name}' zatim v Huawei AppGallery Connect neni zalozena.")
                  sys.exit(0)

              def print_huawei_result(resp, app_id_val, fname):
                  try:
                      rj = resp.json()
                  except Exception:
                      rj = {}
                  ret = rj.get("ret", {})
                  code = str(ret.get("code", ""))
                  msg = str(ret.get("msg", resp.text))
                  if resp.ok and code == "0":
                      print(f"✅ VYSLEDEK HUAWEI APPGALLERY: Balicek {fname} byl uspesne nahran a prirazen k aplikaci (App ID {app_id_val})!")
                  elif code == "204144647" or "can't be edited" in msg or "cannot be edited" in msg:
                      print(f"ℹ️ VYSLEDEK HUAWEI APPGALLERY: Aplikace (App ID {app_id_val}) prave ceka na schvaleni (Reviewing) a je uzamcena proti upravam. Ponechavam stavajici verzi ke schvaleni.")
                  elif code == "204144660" or "version code" in msg.lower():
                      print(f"ℹ️ VYSLEDEK HUAWEI APPGALLERY: Stejna nebo vyssi verze balicku .apk uz je v Huawei AppGallery nahrana (App ID {app_id_val}).")
                  else:
                      print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Server vratil odpoved (kod {code}): {msg}")

              print(f"📦 Nahravam {os.path.basename(apk_path)} do Huawei AppGallery (App ID: {huawei_app_id})...")
              url_res = requests.get(
                  f"{base_agc}/publish/v2/upload-url/for-obs",
                  params={"appId": huawei_app_id, "fileName": os.path.basename(apk_path), "contentLength": os.path.getsize(apk_path)},
                  headers=working_headers,
                  timeout=30
              )
              if url_res.ok and url_res.json().get("urlInfo"):
                  url_info = url_res.json()["urlInfo"]
                  upload_url = url_info.get("url")
                  upload_headers = dict(url_info.get("headers", {}))
                  with open(apk_path, "rb") as apk_f:
                      up_r = requests.put(upload_url, data=apk_f, headers=upload_headers, timeout=300)
                  if up_r.ok:
                      file_info_body = {
                          "fileType": 5,
                          "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": url_info.get("objectId", "")}]
                      }
                      fi_r = requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json=file_info_body, headers=working_headers, timeout=60)
                      print_huawei_result(fi_r, huawei_app_id, os.path.basename(apk_path))
                  else:
                      print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Chyba pri nahravani souboru na uloziste Huawei OBS ({up_r.status_code}).")
              else:
                  u2_res = requests.get(f"{base_agc}/publish/v2/upload-url", params={"appId": huawei_app_id, "suffix": "apk"}, headers=working_headers, timeout=30)
                  if u2_res.ok and u2_res.json().get("uploadUrl"):
                      u2_data = u2_res.json()
                      with open(apk_path, "rb") as apk_f:
                          up2_r = requests.post(
                              u2_data["uploadUrl"],
                              files={"file": (os.path.basename(apk_path), apk_f, "application/octet-stream")},
                              data={"authCode": u2_data.get("authCode", ""), "fileCount": "1"},
                              timeout=300
                          )
                      if up2_r.ok:
                          flist = up2_r.json().get("result", {}).get("UploadFileRsp", {}).get("fileInfoList", [])
                          if flist:
                              dest_url = flist[0].get("fileDestUlr") or flist[0].get("fileDestUrl")
                              fi_body = {"fileType": 5, "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": dest_url}]}
                              fi2_r = requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json=fi_body, headers=working_headers, timeout=60)
                              print_huawei_result(fi2_r, huawei_app_id, os.path.basename(apk_path))
                  else:
                      print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Nelze ziskat nahravaci URL z Huawei AppGallery ({u2_res.status_code}).")
          except Exception as e:
              print(f"⚠️ VYSLEDEK HUAWEI APPGALLERY: Neocekavana chyba pri komunikaci s Huawei API: {e}")
          EOF
          else
            echo "⚠️ VYSLEDEK HUAWEI APPGALLERY: Klic huawei_key.json nebyl v trezoru nalezen, preskakuji Huawei upload."
          fi

  build-ios:
    name: iOS Release (.ipa & TestFlight)
    runs-on: macos-latest
    if: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            for f in ioskey.p12.b64 ioskey.pwd apple_api_key.p8.b64 apple_api_key.props; do
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
            done
            echo "✅ Podpisove klice pro iOS (.p12 a Apple API .p8) nacteny z trezoru ios-keys."
          fi

      - name: Build KMP iOS Framework, Sign and Package IPA
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ "$BUILD_IOS" != "true" ]; then
            echo "ℹ️ iOS build je vypnuty (rezim Pouze Android). Preskakuji."
            exit 0
          fi
          export PATH="$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          export PROJECT_BUILD_NUMBER="${BUILD_NUM}"
          if [ -f "composeApp/build.gradle.kts" ]; then
            DETECTED_PKG=$(sed -n 's/.*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_PKG" ]; then
              export BUNDLE_ID="$DETECTED_PKG"
