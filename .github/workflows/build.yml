                break
              fi

              if grep -qE "90062|90186|closed for new build submissions|must contain a higher version" /tmp/asc_publish.log; then
                if [ $PUB_ATTEMPT -eq $MAX_PUB_ATTEMPTS ]; then
                  echo "❌ VYSLEDEK APPLE APP STORE: Nepodarilo se najit volnou verzi ani po $MAX_PUB_ATTEMPTS pokusech."
                  cat /tmp/asc_publish.log
                  exit 1
                fi
                NEW_VER=$(python3 - << 'PYEOF'
          import re, os
          log_txt = open("/tmp/asc_publish.log", "r", errors="ignore").read()
          cur = os.environ.get("APP_VERSION", "1.0").strip()
          matches = re.findall(r"previously approved version \[([0-9.]+)\]|train version '([0-9.]+)'", log_txt)
          base = cur
          for g1, g2 in matches:
              v = g1 or g2
              if v:
                  base = v
          def parse_v(s):
              parts = [int(x) for x in s.split(".") if x.isdigit()]
              while len(parts) < 2:
                  parts.append(0)
              return parts
          p_cur = parse_v(cur)
          p_base = parse_v(base)
          target = list(p_base if p_base >= p_cur else p_cur)
          target[-1] += 1
          print(".".join(str(x) for x in target))
          PYEOF
                )
                NEW_VER=$(echo "$NEW_VER" | tr -d '\r\n ')
                echo "ℹ️ VYSLEDEK APPLE APP STORE: Verze $APP_VERSION uz byla v App Store schvalena a je uzavrena (kod 90062)."
                echo "🔄 Automaticky zvysuji verzi aplikace na $NEW_VER a prebaluji .ipa..."
                export APP_VERSION="$NEW_VER"
                echo "APP_VERSION=$NEW_VER" >> $GITHUB_ENV

                plutil -replace ApplicationProperties.CFBundleShortVersionString -string "$NEW_VER" build/ios/xcarchive/iosApp.xcarchive/Info.plist || true
                for app_plist in build/ios/xcarchive/iosApp.xcarchive/Products/Applications/*.app/Info.plist; do
                  if [ -f "$app_plist" ]; then
                    plutil -replace CFBundleShortVersionString -string "$NEW_VER" "$app_plist" || true
                  fi
