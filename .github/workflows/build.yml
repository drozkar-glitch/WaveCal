          import os, base64, requests
          repo = os.environ.get("REPO_FULL_NAME", "").strip()
          token = os.environ.get("VAULT_TOKEN", "").strip()
          new_ver = os.environ.get("APP_VERSION", "").strip()
          if repo and token and new_ver:
              url = f"https://api.github.com/repos/{repo}/contents/.github/workflows/build.yml"
              hdrs = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              r = requests.get(url, headers=hdrs, timeout=30)
              if r.ok:
                  d = r.json()
                  raw = base64.b64decode(d["content"]).decode("utf-8")
                  import re
                  updated = re.sub(r'(APP_VERSION:\s*"[^"]*")', f'APP_VERSION: "{new_ver}"', raw)
                  if updated != raw:
                      put_r = requests.put(url, headers=hdrs, json={
                          "message": f"Automaticka aktualizace hlavni verze na {new_ver} [skip ci]",
                          "content": base64.b64encode(updated.encode("utf-8")).decode("utf-8"),
                          "sha": d["sha"]
                      }, timeout=30)
                      if put_r.ok:
                          print(f"🔄 Nova hlavni verze {new_ver} byla automaticky ulozena do .github/workflows/build.yml na GitHubu.")
          PYEOF
            fi

            if [ "$UPLOAD_OK" = "1" ] && [ "$APP_NOT_IN_ASC" = "0" ]; then
              echo "⏳ Kontroluji stav verze $APP_VERSION v App Store Connect a pripravuji odeslani ke schvaleni..."
              python3 - << 'PYEOF'
          import os, sys, time, jwt, requests

          key_id = os.environ.get("APP_STORE_CONNECT_KEY_IDENTIFIER", "").strip()
          issuer_id = os.environ.get("APP_STORE_CONNECT_ISSUER_ID", "").strip()
          bundle_id = os.environ.get("BUNDLE_ID", "").strip()
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101").strip()
          app_ver = os.environ.get("APP_VERSION", "1.0").strip()
          key_path = "/tmp/AuthKey.p8"

          if not key_id or not issuer_id or not os.path.exists(key_path):
              sys.exit(0)

          with open(key_path, "r") as f:
              private_key = f.read()

          def get_headers():
              now = int(time.time())
              payload = {"iss": issuer_id, "iat": now - 30, "exp": now + 1100, "aud": "appstoreconnect-v1"}
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              if isinstance(token, bytes):
                  token = token.decode("utf-8")
              return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          base_url = "https://api.appstoreconnect.apple.com/v1"

          try:
              r = requests.get(f"{base_url}/apps", params={"filter[bundleId]": bundle_id}, headers=get_headers(), timeout=30)
              apps = r.json().get("data", []) if r.ok else []
              if not apps:
                  print(f"ℹ️ VYSLEDEK APPLE APP STORE: Aplikace ({bundle_id}) zatim neni v App Store Connect zalozena. Build je nahrany v TestFlightu.")
                  sys.exit(0)
              app_id = apps[0]["id"]

              def cleanup_empty_draft_submissions():
                  sub_res = requests.get(f"{base_url}/reviewSubmissions", params={"filter[app]": app_id, "filter[state]": "READY_FOR_REVIEW,UNRESOLVED_ISSUES"}, headers=get_headers(), timeout=30)
                  if not sub_res.ok:
                      return
                  for sub in sub_res.json().get("data", []):
                      sub_id = sub["id"]
                      items_res = requests.get(f"{base_url}/reviewSubmissions/{sub_id}/items", headers=get_headers(), timeout=30)
                      items = items_res.json().get("data", []) if items_res.ok else []
                      if len(items) == 0:
                          requests.patch(f"{base_url}/reviewSubmissions/{sub_id}", json={"data": {"type": "reviewSubmissions", "id": sub_id, "attributes": {"canceled": True}}}, headers=get_headers(), timeout=30)

              cleanup_empty_draft_submissions()

              ver_res = requests.get(f"{base_url}/apps/{app_id}/appStoreVersions", params={"filter[platform]": "IOS"}, headers=get_headers(), timeout=30)
              versions = ver_res.json().get("data", []) if ver_res.ok else []

              review_states = {"WAITING_FOR_REVIEW", "IN_REVIEW", "PENDING_DEVELOPER_RELEASE", "PENDING_APPLE_RELEASE", "PROCESSING_FOR_APP_STORE"}
              for v in versions:
                  st = v.get("attributes", {}).get("appStoreState") or v.get("attributes", {}).get("appVersionState") or ""
                  v_str = v.get("attributes", {}).get("versionString", "")
                  if st in review_states:
                      print(f"ℹ️ VYSLEDEK APPLE APP STORE: Verze {v_str} uz v App Store Connect ceka na schvaleni (stav: {st}). Ponechavam aktualni stav.")
                      sys.exit(0)

              editable_states = {"PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "INVALID_BINARY"}
              target_version = None
              for v in versions:
                  st = v.get("attributes", {}).get("appStoreState") or v.get("attributes", {}).get("appVersionState") or ""
                  v_str = v.get("attributes", {}).get("versionString", "")
                  if v_str == app_ver or st in editable_states:
                      target_version = v
                      break

              if not target_version:
                  create_ver_body = {
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {"platform": "IOS", "versionString": app_ver},
                          "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}
                      }
                  }
                  cv_res = requests.post(f"{base_url}/appStoreVersions", json=create_ver_body, headers=get_headers(), timeout=30)
                  if cv_res.ok:
                      target_version = cv_res.json().get("data")
                      print(f"➕ V App Store Connect byla automaticky zalozena nova karta verze {app_ver}.")
                  else:
                      print(f"ℹ️ VYSLEDEK APPLE APP STORE: Novou verzi {app_ver} se nepodarilo automaticky zalozit ({cv_res.status_code}). Build {build_num} je pripraven v TestFlightu.")
                      sys.exit(0)

              version_id = target_version["id"]
              ver_str = target_version.get("attributes", {}).get("versionString", app_ver)
              state = target_version.get("attributes", {}).get("appStoreState") or target_version.get("attributes", {}).get("appVersionState") or "PREPARE_FOR_SUBMISSION"

              if state in editable_states and ver_str != app_ver:
                  upd_v = requests.patch(f"{base_url}/appStoreVersions/{version_id}", json={"data": {"type": "appStoreVersions", "id": version_id, "attributes": {"versionString": app_ver}}}, headers=get_headers(), timeout=30)
                  if upd_v.ok:
                      ver_str = app_ver

              loc_res = requests.get(f"{base_url}/appStoreVersions/{version_id}/appStoreVersionLocalizations", headers=get_headers(), timeout=30)
              if loc_res.ok:
                  for loc in loc_res.json().get("data", []):
                      loc_id = loc["id"]
                      wn = loc.get("attributes", {}).get("whatsNew")
                      if not wn or not str(wn).strip():
                          requests.patch(f"{base_url}/appStoreVersionLocalizations/{loc_id}", json={
                              "data": {
                                  "type": "appStoreVersionLocalizations",
                                  "id": loc_id,
                                  "attributes": {"whatsNew": "Oprava chyb, vylepšení stability a aktualizace funkcí aplikace."}
                              }
                          }, headers=get_headers(), timeout=30)

              valid_build_id = None
              print(f"⏳ Cekam na zpracovani buildu {build_num} u Applu pro prirazeni k verzi {ver_str}...")
              for attempt in range(1, 15):
                  b_res = requests.get(f"{base_url}/builds", params={"filter[app]": app_id, "filter[version]": build_num}, headers=get_headers(), timeout=30)
                  builds = b_res.json().get("data", []) if b_res.ok else []
                  if builds:
                      b_state = builds[0].get("attributes", {}).get("processingState", "")
                      if b_state == "VALID":
                          valid_build_id = builds[0]["id"]
                          print(f"✅ Build {build_num} je u Applu zpracovany a platny (VALID).")
                          break
                  time.sleep(15)

              if valid_build_id:
                  rel_res = requests.patch(f"{base_url}/appStoreVersions/{version_id}/relationships/build", json={"data": {"type": "builds", "id": valid_build_id}}, headers=get_headers(), timeout=30)
                  if rel_res.ok:
                      print(f"🔗 Build {build_num} byl prirazen k iOS verzi {ver_str}.")

              cleanup_empty_draft_submissions()
              create_sub_body = {"data": {"type": "reviewSubmissions", "attributes": {"platform": "IOS"}, "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
              sub_create_res = requests.post(f"{base_url}/reviewSubmissions", json=create_sub_body, headers=get_headers(), timeout=30)
              if sub_create_res.ok:
                  new_sub_id = sub_create_res.json()["data"]["id"]
                  item_body = {"data": {"type": "reviewSubmissionItems", "relationships": {"reviewSubmission": {"data": {"type": "reviewSubmissions", "id": new_sub_id}}, "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}}}}}
                  item_res = requests.post(f"{base_url}/reviewSubmissionItems", json=item_body, headers=get_headers(), timeout=30)
                  if item_res.ok:
                      submit_res = requests.patch(f"{base_url}/reviewSubmissions/{new_sub_id}", json={"data": {"type": "reviewSubmissions", "id": new_sub_id, "attributes": {"submitted": True}}}, headers=get_headers(), timeout=30)
                      if submit_res.ok:
                          print(f"✅ VYSLEDEK APPLE APP STORE: Verze {ver_str} (build {build_num}) byla automaticky odeslana ke schvaleni (Waiting for Review)!")
                      else:
                          print(f"ℹ️ VYSLEDEK APPLE APP STORE: Build {build_num} je prirazen k verzi {ver_str}, ale automaticke odeslani vyzaduje doplneni udaju v App Store Connect ({submit_res.status_code}).")
                          item_id = item_res.json().get("data", {}).get("id")
                          if item_id:
                              requests.delete(f"{base_url}/reviewSubmissionItems/{item_id}", headers=get_headers(), timeout=30)
                          requests.patch(f"{base_url}/reviewSubmissions/{new_sub_id}", json={"data": {"type": "reviewSubmissions", "id": new_sub_id, "attributes": {"canceled": True}}}, headers=get_headers(), timeout=30)
                  else:
                      requests.patch(f"{base_url}/reviewSubmissions/{new_sub_id}", json={"data": {"type": "reviewSubmissions", "id": new_sub_id, "attributes": {"canceled": True}}}, headers=get_headers(), timeout=30)
              cleanup_empty_draft_submissions()
          except Exception as e:
              print(f"⚠️ VYSLEDEK APPLE APP STORE: Upozorneni pri komunikaci s App Store Connect API: {e}")
          PYEOF
            fi
          else
            echo "ℹ️ VYSLEDEK APPLE APP STORE: Publikace do obchodu je vypnuta (rezim bez publikace). Preskakuji TestFlight upload."
          fi

      - name: Upload iOS Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-IPA
          path: build/ios/ipa/*.ipa
